<figure class="publication-figure">
  <img src="{{ include.media }}" alt="{{ page.title | escape }} — framework and results" loading="lazy">
  {% if include.tag and include.tag != "" %}
    <figcaption><span class="publication-badge{% if include.tag == 'Oral' %} publication-badge--oral{% endif %}">{{ include.tag }}</span></figcaption>
  {% endif %}
</figure>
